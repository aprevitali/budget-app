button{cursor:pointer;font-weight:600}

 recurring:()=>{const g={};S.tx.filter(x=>x.a<0&&!OUT.includes(cat(x))&&!INV.includes(cat(x))).forEach(x=>{const k=x.t.toLowerCase();(g[k]=g[k]||{ms:new Set(),s:0,t:x.t}).ms.add(x.d.slice(0,7));g[k].s-=x.a});const r=Object.values(g).filter(o=>o.ms.size>=3).map(o=>[o.t,o.s/o.ms.size,o.ms.size]).sort((x,y)=>y[1]-x[1]).slice(0,8);if(!r.length)return L("No recurring items yet (same description in 3+ months).","Nessuna ricorrenza (stessa descrizione in 3+ mesi).");const t=r.reduce((u,x)=>u+x[1],0);return [...r.map(x=>`${x[0].slice(0,22).padEnd(23)}${eur(x[1])}${L("/mo","/mese")} (${x[2]}x)`),L(`Total ≈ ${eur(t)}/month, ${eur(t*12)}/year`,`Totale ≈ ${eur(t)}/mese, ${eur(t*12)}/anno`)].join("\n")},
 goals:()=>{const v=savAvg(3);let acc=0;return S.goals.map(g=>{const m=Math.max(0,g.target-g.saved);acc+=m;const mo=v>0?Math.ceil(acc/v):null;return`${g.n.slice(0,18).padEnd(19)}${(g.saved/g.target*100).toFixed(0).padStart(3)}%  ${L("missing","mancano")} ${eur(m)}${mo!=null&&m>0?L(` · ~${mo} mo in order`,` · ~${mo} mesi in ordine`):""}`}).join("\n")+"\n"+L(`avg savings ${eur(v)}/month`,`risparmio medio ${eur(v)}/mese`)},
 status:()=>{const r=stats(S.m);return`${S.m}: ${L("income","entrate")} ${eur(r.inc)}, ${L("spending","spese")} ${eur(r.sp)}, ${pct(r.pct)} (${L("threshold","soglia")} ${S.thr}%)`},
 last:a=>S.tx.filter(x=>x.d.startsWith(S.m)).sort((x,y)=>y.d.localeCompare(x.d)).slice(0,+a[0]||5).map(x=>`${x.d.slice(5)}  ${eur2(x.a)}  ${x.t}`).join("\n")||L("no transactions","nessun movimento"),
 find:a=>{const q=a.join(" ").toLowerCase();if(!q)return L("usage: find coffee","uso: find caffè");const r=S.tx.filter(x=>x.t.toLowerCase().includes(q)),n=new Set(r.map(x=>x.d.slice(0,7))).size,t=r.reduce((u,x)=>u+x.a,0);return L(`${r.length} transactions, total ${eur2(t)}${n?`, avg ${eur(t/n)}/month`:""}`,`${r.length} movimenti, totale ${eur2(t)}${n?`, media ${eur(t/n)}/mese`:""}`)},
 top:a=>Object.entries(stats(S.m).by).sort((x,y)=>y[1]-x[1]).slice(0,+a[0]||5).map(([c,v])=>`${cn(c).padEnd(13)}${eur(v)}`).join("\n")||L("no spending","nessuna spesa"),
 avg:a=>{const R=dataMs().slice(-(+a[0]||3)).map(stats).filter(r=>r.inc>0);if(!R.length)return L("no data","nessun dato");const i=R.reduce((t,r)=>t+r.inc,0),e=R.reduce((t,r)=>t+r.sp,0);return L(`${R.length} months: you spend ${(e/i*100).toFixed(0)}% of income, avg savings ${eur((i-e)/R.length)}/month`,`${R.length} mesi: spendi il ${(e/i*100).toFixed(0)}% delle entrate, risparmio medio ${eur((i-e)/R.length)}/mese`)},
 threshold:a=>{const v=ev(a[0]||"");if(isNaN(v)||v<=0||v>=200)return L("usage: threshold 70","uso: soglia 70");S.thr=v;save();render();return L("threshold ","soglia ")+v+"%"},
 undo:()=>{const x=S.tx.pop();save();render();return x?L("removed: ","rimosso: ")+`${x.t} ${eur2(x.a)}`:L("nothing to undo","niente da annullare")},
 month:a=>/^\d{4}-\d{2}$/.test(a[0]||"")?(S.m=a[0],render(),"month "+a[0]):L("usage: month 2026-09","uso: month 2026-09"),
 export:()=>($("exp").click(),L("backup downloaded","backup scaricato")),
 help:()=>HELP.map(h=>h[0].padEnd(22)+L(h[1],h[2])).join("\n")+"\n"+L("Tab completes, ↑↓ history. Italian aliases work too (spesa, entrata, saldo, cassetto…).","Tab completa, ↑↓ cronologia. Funzionano anche gli alias inglesi.")
};
Object.assign(CMD,{aiuto:CMD.help,"?":CMD.help,"=":CMD.calc,spesa:CMD.spend,entrata:CMD.income,saldo:CMD.balance,cassetto:CMD.bucket,cassetti:CMD.goals,stato:CMD.kpi,ultimi:CMD.last,cerca:CMD.find,media:CMD.avg,soglia:CMD.threshold,annulla:CMD.undo,vai:CMD.go,tema:CMD.theme,mese:CMD.month,esporta:CMD.export,previsione:CMD.forecast,autonomia:CMD.runway,andamento:CMD.trend,categoria:CMD.cat,confronto:CMD.vs,ricorrenti:CMD.recurring,lingua:CMD.lang,status:CMD.status});
CMD.source=()=>"AGPL-3.0 · "+SOURCE_URL;
function runCmd(t){const a=t.trim().split(/\s+/),c=a.shift().toLowerCase();return(CMD[c]||(()=>L("unknown command, try: help","comando sconosciuto, prova: help")))(a)}
function cp(o){$("cp").hidden=!o;if(o){chipsRender();$("cpi").focus()}}
const H=[];let hx=0;
function chipsRender(){$("chips").innerHTML=["kpi","runway","forecast","trend","vs","recurring","goals","help"].map(c=>`<button data-k="${c}">${c}</button>`).join("");$("chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{runLine(b.dataset.k);$("cpi").focus()})}
function runLine(t){H.push(t);hx=H.length;$("cpo").insertAdjacentHTML("beforeend",`<div>› ${esc(t)}</div><div class="mute">${esc(runCmd(t))}</div>`);$("cpo").scrollTop=1e5}
$("cpi").onkeydown=e=>{const el=e.target;
 if(e.key==="Enter"&&el.value.trim()){runLine(el.value);el.value=""}
 else if(e.key==="Escape")cp(false);
 else if(e.key==="ArrowUp"&&H.length){e.preventDefault();hx=Math.max(0,hx-1);el.value=H[hx]}
 else if(e.key==="ArrowDown"&&H.length){e.preventDefault();hx=Math.min(H.length,hx+1);el.value=H[hx]||""}
 else if(e.key==="Tab"){e.preventDefault();const k=Object.keys(CMD).filter(c=>c.startsWith(el.value.toLowerCase()));if(k.length===1)el.value=k[0]+" "}};
$("kb").onclick=()=>cp(true);$("cp").onclick=e=>{if(e.target.id==="cp")cp(false)};
$("theme").onchange=e=>setTheme(e.target.value);
addEventListener("keydown",e=>{if((e.key==="k"&&(e.metaKey||e.ctrlKey))||(e.key==="/"&&!/INPUT|SELECT/.test(document.activeElement.tagName))){e.preventDefault();cp(true)}});
$("src").href=SOURCE_URL;S.lang=S.lang||"en";$("lang").value=S.lang;$("lang").onchange=e=>{S.lang=e.target.value;save();render()};
setTheme(S.theme||(matchMedia("(prefers-color-scheme: light)").matches?"carta":"nebula"));
render();
</script>
